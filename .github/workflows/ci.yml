# CI: every push must build, pass typecheck/lint/tests and contain no secrets.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: mihwar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: postgresql://mihwar_app:ci_app_password@localhost:5432/mihwar?schema=public
      MIGRATION_URL: postgresql://admin:admin@localhost:5432/mihwar?schema=public
      APP_URL: http://localhost:5173
      API_ORIGIN: http://localhost:4000
      CLIENT_ORIGINS: http://localhost:5173
      JWT_ISSUER: mihwar-ci
      JWT_AUDIENCE: mihwar-ci
      REDIS_URL: redis://localhost:6379
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Random per-run test secrets
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build:shared
      - name: Migrations and app role
        working-directory: server
        run: |
          DATABASE_URL="$MIGRATION_URL" npx prisma migrate deploy
          echo "ALTER ROLE mihwar_app LOGIN PASSWORD 'ci_app_password';" | npx prisma db execute --stdin --url "$MIGRATION_URL"
          npx prisma generate
      - name: Server typecheck and lint
        run: npm run typecheck --workspace=server && npm run lint --workspace=server
      - name: Server tests
        run: npm run test --workspace=server
      - name: Client lint and full build
        run: npm run lint --workspace=client && npm run build --workspace=client
